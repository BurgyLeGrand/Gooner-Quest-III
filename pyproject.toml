[project]
name = "my-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "panda>=0.3.1",
    "pandas>=3.0.5",
    "pygame>=2.6.1",
    "pyinstaller>=6.22.0",
    "requests>=2.34.2",
]

[project.scripts]
my-project = "my_project:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
